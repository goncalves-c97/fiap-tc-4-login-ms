name: CI/CD - Terraform + SonarQube + Dockerhub

on:
  pull_request:
    branches: [ "production" ]
    paths:
      - ".github/workflows/**"
      - "LoginMs/terraform/**"
      - "LoginMs/WebApi/**"
      - "LoginMs/Core/**"
      - "LoginMs/Infra.*/**"
      - "LoginMs/Test/**"
      - "LoginMs/Dockerfile"
      - "LoginMs/LoginMs.sln"

  push:
    branches: [ "production" ]
    paths:
      - ".github/workflows/**"
      - "LoginMs/terraform/**"
      - "LoginMs/WebApi/**"
      - "LoginMs/Core/**"
      - "LoginMs/Infra.*/**"
      - "LoginMs/Test/**"
      - "LoginMs/Dockerfile"
      - "LoginMs/LoginMs.sln"

jobs:

  # =========================
  # TERRAFORM
  # =========================
  terraform:
    if: contains(join(github.event.pull_request.changed_files || '', ''), '')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: LoginMs/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve


  # =========================
  # API (.NET + SONAR)
  # =========================
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install SonarScanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Restore
        run: dotnet restore LoginMs/LoginMs.sln

      - name: Begin SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner begin /k:"goncalves-c97_fiap-tc-4-login-ms" /o:"goncalves-c97" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.login="$SONAR_TOKEN" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml" /d:sonar.sources="LoginMs/Core,LoginMs/Infra.Data.SqlServer,LoginMs/WebApi" /d:sonar.tests="LoginMs/Test" /d:sonar.exclusions="**/wwwroot/**,**/*.cshtml,**/Program.cs"

      - name: Build
        run: dotnet build LoginMs/LoginMs.sln --no-restore --configuration Release
  
      #- name: Test with coverage
      #  run: dotnet test LoginMs/LoginMs.sln --no-build --configuration Release --collect:"XPlat Code Coverage" /p:CoverletOutputFormat=cobertura /p:UseSourceLink=true
      - name: Test with OpenCover
        run: dotnet test LoginMs/LoginMs.sln --no-build --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=opencover

      - name: Debug OpenCover file
        run: find . -name "coverage.opencover.xml"

        
      - name: End SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.login="$SONAR_TOKEN"

  # =========================
  # DOCKER (só no merge)
  # =========================
  docker:
    needs: api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            goncalvesc97/fiap-tc-4-login-ms:latest
            goncalvesc97/fiap-tc-4-login-ms:${{ github.sha }}
