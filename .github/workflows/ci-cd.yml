name: CI/CD - Infra + API

on:
  pull_request:
    branches: [ "production" ]
    paths:
      - "terraform/**"
      - "WebApi/**"
      - "Core/**"
      - "Infra.*/**"
      - "Test/**"
      - "Dockerfile"
      - "LoginMs.sln"

  push:
    branches: [ "production" ]
    paths:
      - "terraform/**"
      - "WebApi/**"
      - "Core/**"
      - "Infra.*/**"
      - "Test/**"
      - "Dockerfile"
      - "LoginMs.sln"

jobs:

  # =========================
  # TERRAFORM
  # =========================
  terraform:
    if: contains(join(github.event.pull_request.changed_files || '', ''), '')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve


  # =========================
  # API (.NET + SONAR)
  # =========================
  api:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LoginMs.sln

      - name: Build
        run: dotnet build LoginMs.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test LoginMs.sln --configuration Release --no-build

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=goncalves-c97_fiap-tc-4-login-ms
            -Dsonar.organization=goncalves-c97
            -Dsonar.sources=WebApi,Core


  # =========================
  # DOCKER (só no merge)
  # =========================
  docker:
    needs: api
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            goncalvesc97/fiap-tc-4-login-ms:latest
            goncalvesc97/fiap-tc-4-login-ms:${{ github.sha }}
